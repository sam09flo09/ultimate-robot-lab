<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Renderer Preview</title>
  <style>
    :root { --cream: #FDF9F2; --ink: #0C0B0A; --orange: #FF6A1A; --deep: #D6540E; --sand: #E9E0D2; --paper: #FFFDF9; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; padding: 10px 12px; background: var(--cream); color: var(--ink); display: flex; flex-direction: column; gap: 8px;
           font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
    .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .bar button, .bar select { font: inherit; min-height: 32px; padding: 0 10px; border: 1px solid var(--sand); border-radius: 8px; background: var(--paper); color: var(--ink); cursor: pointer; }
    .bar button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    #stats { font: 600 12px ui-monospace, Menlo, monospace; color: var(--deep); }
    #log { font: 11px ui-monospace, Menlo, monospace; color: #5A534B; }
    main { flex: 1; min-height: 0; display: flex; gap: 10px; }
    .pane { position: relative; background: var(--paper); border: 1px solid var(--sand); border-radius: 10px; overflow: hidden; min-width: 0; }
    .pane.big { flex: 2; }
    .pane.small { flex: 1; }
    .pane canvas { width: 100%; height: 100%; display: block; }
    .pane .tag { position: absolute; left: 8px; top: 6px; font: 600 11px ui-monospace, Menlo, monospace; color: #5A534B; pointer-events: none; }
  </style>
</head>
<body>
  <div class="bar">
    <strong>Robot Lab 3D preview</strong>
    <select id="world"></select>
    <span>Camera:</span>
    <button data-cam="orbit">Orbit</button>
    <button data-cam="overhead">Overhead</button>
    <button data-cam="follow">Follow</button>
    <button id="reset">Reset camera</button>
    <button id="quality">Quality: high</button>
    <label><input type="checkbox" id="path" checked /> path</label>
    <label><input type="checkbox" id="sensors" checked /> sensors</label>
    <label><input type="checkbox" id="zones" checked /> zones</label>
    <label><input type="checkbox" id="run" checked /> run</label>
    <button id="restart">Restart</button>
    <button id="stress">Create/dispose ×20</button>
    <span id="stats"></span>
  </div>
  <div id="log"></div>
  <main>
    <div class="pane big"><canvas id="c3"></canvas><span class="tag">3D</span></div>
    <div class="pane small"><canvas id="c2"></canvas><span class="tag">2D (reference)</span></div>
  </main>
  <script type="module" src="./preview.ts"></script>
</body>
</html>
