<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Renderer Preview</title>
  <style>
    :root { --cream: #FDF9F2; --ink: #0C0B0A; --orange: #FF6A1A; --sand: #E9E0D2; --paper: #FFFDF9; }
    body { margin: 0; padding: 16px; background: var(--cream); color: var(--ink);
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p.note { margin: 0 0 16px; font-size: 13px; color: #5A534B; }
    .bar { display: flex; gap: 16px; align-items: center; margin-bottom: 16px; font-size: 13px; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
    .card { background: var(--paper); border: 1px solid var(--sand); border-radius: 10px; padding: 10px; }
    .card h2 { font: 600 13px ui-monospace, Menlo, monospace; margin: 0 0 2px; }
    .card .d { font-size: 12px; color: #5A534B; margin: 0 0 8px; min-height: 3em; }
    .card canvas { width: 100%; aspect-ratio: 1 / 1; display: block; border-radius: 6px; touch-action: none; }
    .card .info { font: 11px ui-monospace, Menlo, monospace; color: #5A534B; margin-top: 6px; }
    #fps { font: 600 13px ui-monospace, Menlo, monospace; color: var(--orange); }
  </style>
</head>
<body>
  <h1>Robot Lab renderer preview</h1>
  <p class="note">Each playground is drawn with a fake SimState (path, pen stroke, distance ray). Hover a field to check toWorld(). Big field below is 800×800 for the performance check.</p>
  <div class="bar">
    <label><input type="checkbox" id="animate" checked /> animate</label>
    <label><input type="checkbox" id="zones" checked /> show zones</label>
    <label><input type="checkbox" id="path" checked /> show path</label>
    <label><input type="checkbox" id="sensors" checked /> show sensors</label>
    <label><input type="checkbox" id="select" /> highlight first item (editor)</label>
    <label><input type="checkbox" id="nullstate" /> state = null (editor mode)</label>
    <span id="fps"></span>
  </div>
  <div class="grid" id="grid"></div>
  <h1 style="margin-top:24px">800 × 800</h1>
  <div class="card" style="width:800px;max-width:100%">
    <canvas id="big" style="width:800px;height:800px;max-width:100%;aspect-ratio:auto"></canvas>
  </div>
  <script type="module" src="./preview.ts"></script>
</body>
</html>
